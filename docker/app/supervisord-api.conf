[program:xsa-api]
command=/opt/xsa-venv/bin/uvicorn xsa.api.app:app --host 0.0.0.0 --port 8765 --log-level info
directory=/app/backend
environment=PYTHONPATH="/app/backend"
priority=50
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
