[project]
name = "xsa"
version = "0.1.0"
description = "XSpace Analyzer - automatic X Spaces recorder & intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "playwright==1.63.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
transcription = ["faster-whisper>=1.1", "av<19"]

[project.scripts]
xsa = "xsa.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xsa*"]

[tool.setuptools.package-data]
xsa = ["db/migrations/*.ini", "db/migrations/**/*.py", "db/migrations/*.mako", "resources/*", "api/assets/*", "api/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
